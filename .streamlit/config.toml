# Dashboard theme — matches src/reporting/theme.py tokens. Viewers can still
# switch light/dark in the app menu; charts follow via st.context.theme.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans-serif"
baseRadius = "medium"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"

[server]
headless = true

[browser]
gatherUsageStats = false
